# 把仓内 site/ 发布成 GitHub Pages（纯静态，无需构建步骤）。
#
# 用法：仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"，
# 之后每次推送 main/master 会自动发布到 https://<owner>.github.io/<repo>/。
# 站点是 tools/build_site.py 生成的成品 HTML，本 workflow 不做任何编译，只搬运 site/。
name: pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
