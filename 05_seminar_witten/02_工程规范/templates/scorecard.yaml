# 评分卡模板 —— 复制到 seminars/SEM-XXXX/score/scorecard.yaml
# 校验：python tools/score/scorecard_lint.py --file <this>
schema_version: 1
seminar: SEM-XXXX
cycle: CYCLE-0000
season: 2026Q4
playbook_version: 0.3.0
rubric_sha: "sha256:REPLACE"
judge:
  model: "REPLACE"
  session: "REPLACE"
  context: fresh-blind
blind: true
graded_at: "2026-11-10T15:00:00+08:00"

l1:
  total: 0            # 0-60
  items:
    L1-C1: 0          # 12
    L1-C2: 0          # 8
    L1-F1: 0          # 6
    L1-F2: 0          # 2
    L1-A1: 0          # 8
    L1-B1: 0          # 8
    L1-E1: 0          # 8
    L1-E2: 0          # 4
    L1-D1: 0          # 4
  veto: false
  veto_reason: null

l2:
  total: 0            # 0-40
  dims:
    L2-A2:
      score: 0
      max: 8
      evidence: []    # 至少 1 条 {file, line, quote}
      note: ""
    L2-B2:
      score: 0
      max: 12
      evidence: []
      note: ""
    L2-D:
      score: 0
      max: 15
      evidence: []
      note: ""
    L2-E3:
      score: 0
      max: 5
      evidence: []
      note: ""
  no_evidence_deductions: 0   # 必须为 0
  low_confidence: []

human:
  sampling: active            # active | random
  claim_checks:
    - claim: C-000
      anchor: "[src p.0]"
      verdict: consistent     # consistent | wording | anchor_wrong | fabricated
      note: ""
  retell: pass                # pass | fail
  disagree_with_l2: false
  minutes: 0

process:
  roles:
    r01:
      grade: B
      total: 80
      dims: {P1: 0, P2: 0, P3: 0, P4: 0, P5: 0, P6: 0, P7: 0}
      strengths: []
      weaknesses: []
      incidents: []
  overall: 0

incidents: []                 # incident id 列表

verdict: revise               # publish | revise | reject
verdict_reason: ""
top_fixes:
  - priority: P0              # P0 | P1 | P2
    target: "note/ch01.md:12"
    issue: ""
    action: ""
    owner: chair
    verify: ""
lessons_proposed: []

human_review:
  ratified: null              # true | false | null
  overrides: []
  signed_by: null
  signed_at: null
